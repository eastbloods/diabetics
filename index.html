<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diyabet Takip Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #06b6d4;
            --accent-hover: #0891b2;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* UYARI MESAJLARI (ALERTS) */
        #alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateX(50px);
            animation: slideIn 0.3s forwards;
            min-width: 250px;
        }

        .alert.success { background-color: var(--success); }
        .alert.error { background-color: var(--danger); }
        .alert.fade-out { animation: fadeOut 0.5s forwards; }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(50px); }
        }

        /* GÖRÜNÜM YÖNETİMİ */
        .view {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .view.active {
            display: flex;
            opacity: 1;
        }

        /* FORMLAR & BUTONLAR */
        .auth-container {
            width: 100%;
            max-width: 400px;
            margin: auto;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            margin-top: 10px;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: var(--border);
        }

        .link-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .link-text a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }
        .link-text a:hover {
            text-decoration: underline;
        }

        /* SPINNER */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        .loading .spinner { display: inline-block; }
        .loading .btn-text { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* DASHBOARD LAYOUT */
        #dashboard-view {
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }

        .navbar h1 { font-size: 1.5rem; color: var(--accent); }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .dashboard-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            margin-bottom: 20px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        /* ŞEKER RENKLENDİRMELERİ */
        .sugar-good { border-color: var(--success) !important; color: var(--success); }
        .sugar-warning { border-color: var(--warning) !important; color: var(--warning); }
        .sugar-danger { border-color: var(--danger) !important; color: var(--danger); }

        /* TOGGLE SWITCH */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        /* ANALİZ SONUÇ KUTUSU */
        .analysis-result {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--bg-color);
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
        }
        .analysis-result p {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 4px;
        }
        .analysis-result p:last-child { border: none; margin:0; padding:0; }
